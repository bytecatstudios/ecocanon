<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ecocañón | ByteCat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#2f8fa3;
    --sky-bottom:#7fd6c9;
    --sun:#f7c948;
    --sun-glow:#ffe08a;
    --foam:#eaf7f0;
    --ink:#173534;
    --panel:#0e2e2c;
    --panel-edge:#0a2321;
    --trash-bad:#8a5a2b;
    --clean:#5fd0b0;
    --paper:#fbf3df;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:#0a2321;
    font-family:'Baloo 2', sans-serif;
    color:var(--paper);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .pixel{ font-family:'Press Start 2P', monospace; }

  #stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#0a2321;
  }
  #frame{
    position:relative;
    width:100%; height:100%;
    max-width: 960px;
    max-height: 540px;
    aspect-ratio: 16/9;
    box-shadow: 0 0 0 6px #0a2321, 0 0 40px rgba(0,0,0,.6);
    background:#000;
    overflow:hidden;
  }
  @media (max-aspect-ratio: 16/9){
    #frame{ width:100vw; height:calc(100vw * 9 / 16); }
  }
  @media (min-aspect-ratio: 16/9){
    #frame{ height:100vh; width:calc(100vh * 16 / 9); }
  }

  canvas{
    display:block;
    width:100%; height:100%;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    touch-action:none;
  }

  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background: radial-gradient(ellipse at center, rgba(10,35,33,.55) 0%, rgba(10,35,33,.86) 75%);
    padding: 6% 8%;
  }
  .hidden{ display:none !important; }

  .title{
    font-size: clamp(20px, 5.4vw, 40px);
    line-height:1.5;
    color:var(--paper);
    text-shadow: 3px 3px 0 var(--panel-edge), 0 0 24px rgba(95,208,176,.5);
    margin: 0 0 4px 0;
  }
  .subtitle{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: clamp(13px, 2.6vw, 17px);
    color:var(--clean);
    margin: 0 0 22px 0;
    letter-spacing:.3px;
  }
  .rules{
    font-family:'Baloo 2', sans-serif;
    font-size: clamp(12px, 2.2vw, 15px);
    color:var(--paper);
    max-width: 480px;
    line-height:1.7;
    margin: 0 0 26px 0;
    opacity:.92;
  }
  .rules b{ color: var(--sun); }

  button.playbtn{
    font-family:'Press Start 2P', monospace;
    font-size: clamp(11px, 2.6vw, 15px);
    color: var(--ink);
    background: linear-gradient(180deg, var(--sun-glow), var(--sun));
    border: none;
    border-bottom: 5px solid #c9922a;
    border-radius: 10px;
    padding: 16px 30px;
    cursor:pointer;
    letter-spacing:1px;
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
    transition: transform .08s ease;
  }
  button.playbtn:active{ transform: translateY(4px); border-bottom-width:1px; box-shadow:none; }

  .scorebig{
    font-family:'Press Start 2P', monospace;
    font-size: clamp(24px, 6vw, 44px);
    color: var(--sun);
    margin: 6px 0 2px 0;
    text-shadow: 3px 3px 0 var(--panel-edge);
  }
  .scorelabel{ font-size: 13px; letter-spacing: 2px; color:var(--foam); opacity:.85; margin-bottom:18px; }

  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding: 10px 12px;
    pointer-events:none;
    gap: 8px;
  }
  .chip{
    font-family:'Press Start 2P', monospace;
    font-size: clamp(9px, 1.9vw, 12px);
    background: var(--panel);
    border: 2px solid var(--panel-edge);
    border-bottom-width: 4px;
    color: var(--paper);
    padding: 7px 10px;
    border-radius: 8px;
    display:flex; align-items:center; gap:7px;
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
  }
  .chip .ic{ font-size: 1.3em; line-height:1; }

  #pollwrap{ flex:1; max-width: 220px; }
  #pollbar{
    position:relative;
    width:100%; height:16px;
    background: #06201e;
    border:2px solid var(--panel-edge);
    border-radius: 8px;
    overflow:hidden;
    margin-top:6px;
  }
  #pollfill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background: linear-gradient(90deg, #6b4a25, #8a5a2b);
    transition: width .25s ease;
  }

  .touchctl{
    position:absolute; bottom:14px; left:0; right:0;
    display:flex; justify-content:space-between; padding:0 14px;
    pointer-events:none;
  }
  .touchbtn{
    pointer-events:auto;
    width: 62px; height:62px;
    border-radius: 50%;
    background: rgba(14,46,44,.72);
    border: 2px solid var(--panel-edge);
    color: var(--paper);
    font-size: 26px;
    display:flex; align-items:center; justify-content:center;
    user-select:none;
    -webkit-user-select:none;
  }
  .touchbtn:active{ background: rgba(95,208,176,.5); }

  @media (hover:hover) and (pointer:fine){
    .touchctl{ display:none; }
  }

  .footer-hint{
    font-size: 11px; opacity:.6; margin-top:4px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="chip"><span class="ic">🗑️</span><span id="scoreVal">0</span></div>
      <div id="pollwrap">
        <div class="chip" style="width:100%;"><span class="ic">🌊</span><span>Contaminación</span></div>
        <div id="pollbar"><div id="pollfill"></div></div>
      </div>
      <div class="chip"><span class="ic">⏱️</span><span id="timeVal">60</span></div>
    </div>

    <div class="touchctl hidden" id="touchctl">
      <div class="touchbtn" id="btnLeft">◀</div>
      <div class="touchbtn" id="btnRight">▶</div>
    </div>

    <div class="overlay" id="startScreen">
      <div class="title pixel">ECOCAÑÓN</div>
      <div class="subtitle">Ayuda al gatito a limpiar el río</div>
      <div class="rules">
        Muévete con <b>◀ ▶</b>, las flechas o <b>A/D</b>.
        Haz <b>click o toca el agua</b> sobre la basura para bajar el anzuelo y atraparla.
        Si el río se contamina demasiado, ¡se acabó el juego!
      </div>
      <button class="playbtn" id="btnStart">JUGAR</button>
    </div>

    <div class="overlay hidden" id="endScreen">
      <div class="title pixel" id="endTitle">¡RÍO LIMPIO!</div>
      <div class="scorelabel">BASURA RECOLECTADA</div>
      <div class="scorebig" id="finalScore">0</div>
      <button class="playbtn" id="btnRetry">JUGAR DE NUEVO</button>
    </div>
  </div>
</div>

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
canvas.width = W; canvas.height = H;

function loadImage(src){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.src = src;
  });
}

let imgBg, imgCat, imgTrash, catFrameW, catFrameH;

const WATER_LINE = H * 0.50;

// ---------- State ----------
let state = 'start'; // start | playing | over
let score = 0;
let pollution = 0;
const POLLUTION_MAX = 8;
let timeLeft = 60;
let lastTs = 0;
let spawnTimer = 0;
let spawnInterval = 1.6;
let elapsed = 0;

const boat = {
  x: W/2,
  y: WATER_LINE - 6,
  w: 168, h: 168,
  vx: 0,
  frame: 0,
  frameTimer: 0,
};

const keys = {left:false, right:false};

// ---------- Hook (anzuelo) ----------
const HOOK_REST_DROP = 34;   // qué tan abajo cuelga en reposo, relativo a la línea de agua
const HOOK_MAX_REACH = 300;  // distancia máxima de lanzamiento desde el punto de reposo
const HOOK_CAST_SPEED = 520;
const HOOK_RETRIEVE_SPEED = 430;
const HOOK_CATCH_R = 26;

function hookRestPos(){
  return { x: boat.x, y: WATER_LINE + HOOK_REST_DROP };
}

const hook = {
  x: hookRestPos().x,
  y: hookRestPos().y,
  state: 'idle', // idle | casting | retrieving
  target: {x:0, y:0},
  caught: null,
};

function canvasPointerXY(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / rect.width * W,
    y: (clientY - rect.top) / rect.height * H,
  };
}

function tryCast(clientX, clientY){
  if(state !== 'playing') return;
  if(hook.state !== 'idle') return;
  const p = canvasPointerXY(clientX, clientY);
  const rest = hookRestPos();
  let tx = Math.max(14, Math.min(W - 14, p.x));
  let ty = Math.max(WATER_LINE + 6, Math.min(H - 12, p.y));
  const dx = tx - rest.x, dy = ty - rest.y;
  const dist = Math.hypot(dx, dy);
  if(dist > HOOK_MAX_REACH){
    const s = HOOK_MAX_REACH / dist;
    tx = rest.x + dx * s;
    ty = rest.y + dy * s;
  }
  hook.target = {x: tx, y: ty};
  hook.state = 'casting';
  ripples.push({x: tx, y: ty, life: 1});
}

const trashTypes = [
  { hue: 0,    scale: 1.0, speedMul: 1.0, value: 10 },
  { hue: 120,  scale: 0.72, speedMul: 1.35, value: 15 },
  { hue: -70,  scale: 1.35, speedMul: 0.75, value: 6  },
  { hue: 200,  scale: 0.9, speedMul: 1.1, value: 12 },
];

let trashList = [];
let ripples = [];
let popups = [];

function rand(a,b){ return a + Math.random()*(b-a); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function spawnTrash(){
  const type = choice(trashTypes);
  const fromLeft = Math.random() < 0.5;
  const baseSpeed = rand(38, 60) * type.speedMul * (1 + elapsed/90);
  const size = 46 * type.scale;
  trashList.push({
    x: fromLeft ? -size : W + size,
    y: rand(WATER_LINE + 26, H - 46),
    vx: (fromLeft ? 1 : -1) * baseSpeed,
    size,
    hue: type.hue,
    value: type.value,
    bob: rand(0, Math.PI*2),
    caught: false,
    scaleAnim: 1,
  });
}

function resetGame(){
  score = 0; pollution = 0; timeLeft = 60; elapsed = 0;
  spawnTimer = 0; spawnInterval = 1.6;
  trashList = []; ripples = []; popups = [];
  boat.x = W/2; boat.vx = 0;
  hook.state = 'idle';
  hook.caught = null;
  const rest = hookRestPos();
  hook.x = rest.x; hook.y = rest.y;
}

function updateHUD(){
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('timeVal').textContent = Math.ceil(timeLeft);
  document.getElementById('pollfill').style.width = (pollution/POLLUTION_MAX*100) + '%';
}

function startGame(){
  resetGame();
  state = 'playing';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('touchctl').classList.remove('hidden');
  updateHUD();
}

function endGame(won){
  state = 'over';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('touchctl').classList.add('hidden');
  document.getElementById('endTitle').textContent = won ? '¡RÍO LIMPIO!' : 'RÍO CONTAMINADO';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('endScreen').classList.remove('hidden');
}

// ---------- Input ----------
window.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowLeft' || e.key.toLowerCase()==='a') keys.left = true;
  if(e.key === 'ArrowRight' || e.key.toLowerCase()==='d') keys.right = true;
});
window.addEventListener('keyup', (e)=>{
  if(e.key === 'ArrowLeft' || e.key.toLowerCase()==='a') keys.left = false;
  if(e.key === 'ArrowRight' || e.key.toLowerCase()==='d') keys.right = false;
});

canvas.addEventListener('pointerdown', (e)=>{
  tryCast(e.clientX, e.clientY);
});

function bindHold(el, onFn, offFn){
  el.addEventListener('pointerdown', (e)=>{ e.preventDefault(); onFn(); });
  el.addEventListener('pointerup', offFn);
  el.addEventListener('pointerleave', offFn);
  el.addEventListener('pointercancel', offFn);
}
bindHold(document.getElementById('btnLeft'), ()=>keys.left=true, ()=>keys.left=false);
bindHold(document.getElementById('btnRight'), ()=>keys.right=true, ()=>keys.right=false);

document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnRetry').addEventListener('click', startGame);

// ---------- Update ----------
const BOAT_HALF_W = 70;
function update(dt){
  elapsed += dt;
  timeLeft -= dt;
  if(timeLeft <= 0){
    timeLeft = 0;
    endGame(true);
    updateHUD();
    return;
  }

  // boat movement
  const accel = 620, friction = 720, maxSpeed = 260;
  if(keys.left) boat.vx -= accel*dt;
  if(keys.right) boat.vx += accel*dt;
  if(!keys.left && !keys.right){
    if(boat.vx > 0) boat.vx = Math.max(0, boat.vx - friction*dt);
    else boat.vx = Math.min(0, boat.vx + friction*dt);
  }
  boat.vx = Math.max(-maxSpeed, Math.min(maxSpeed, boat.vx));
  boat.x += boat.vx * dt;
  boat.x = Math.max(BOAT_HALF_W, Math.min(W - BOAT_HALF_W, boat.x));

  boat.frameTimer += dt;
  if(boat.frameTimer > 0.22){
    boat.frameTimer = 0;
    boat.frame = (boat.frame + 1) % 3;
  }

  // spawn
  spawnTimer += dt;
  spawnInterval = Math.max(0.55, 1.6 - elapsed*0.012);
  if(spawnTimer >= spawnInterval){
    spawnTimer = 0;
    spawnTrash();
  }

  // ---- hook state machine ----
  if(hook.state === 'casting'){
    const dx = hook.target.x - hook.x, dy = hook.target.y - hook.y;
    const dist = Math.hypot(dx, dy);
    const step = HOOK_CAST_SPEED * dt;
    if(dist <= step){
      hook.x = hook.target.x; hook.y = hook.target.y;
      hook.state = 'retrieving';
    } else {
      hook.x += dx/dist*step;
      hook.y += dy/dist*step;
    }
  } else if(hook.state === 'retrieving'){
    const rest = hookRestPos();
    const dx = rest.x - hook.x, dy = rest.y - hook.y;
    const dist = Math.hypot(dx, dy);
    const step = HOOK_RETRIEVE_SPEED * dt;
    if(dist <= step){
      hook.x = rest.x; hook.y = rest.y;
      if(hook.caught){
        const t = hook.caught;
        score += t.value;
        pollution = Math.max(0, pollution - 0.4);
        popups.push({x: hook.x, y: hook.y, life:1, text:'+'+t.value});
        const idx = trashList.indexOf(t);
        if(idx >= 0) trashList.splice(idx,1);
        hook.caught = null;
      }
      hook.state = 'idle';
    } else {
      hook.x += dx/dist*step;
      hook.y += dy/dist*step;
    }
  } else {
    const rest = hookRestPos();
    hook.x = rest.x;
    hook.y = rest.y;
  }

  for(let i = trashList.length - 1; i >= 0; i--){
    const t = trashList[i];
    if(t === hook.caught){
      t.x = hook.x; t.y = hook.y;
      continue;
    }
    t.x += t.vx * dt;
    t.bob += dt*2.4;

    if(hook.state === 'casting'){
      const dx = t.x - hook.x, dy = t.y - hook.y;
      if(Math.hypot(dx,dy) < HOOK_CATCH_R){
        hook.caught = t;
        hook.state = 'retrieving';
        continue;
      }
    }

    if(t.x < -80 || t.x > W + 80){
      pollution += 1;
      trashList.splice(i,1);
      if(pollution >= POLLUTION_MAX){
        pollution = POLLUTION_MAX;
        endGame(false);
        updateHUD();
        return;
      }
    }
  }

  for(let i = ripples.length-1; i>=0; i--){
    ripples[i].life -= dt*1.6;
    if(ripples[i].life <= 0) ripples.splice(i,1);
  }

  for(let i = popups.length-1; i>=0; i--){
    popups[i].life -= dt*1.1;
    popups[i].y -= dt*30;
    if(popups[i].life <= 0) popups.splice(i,1);
  }

  updateHUD();
}

// ---------- Draw ----------
function drawBackground(){
  ctx.drawImage(imgBg, 0, 0, W, H);
  // water tint overlay for readability
  const grad = ctx.createLinearGradient(0, WATER_LINE, 0, H);
  grad.addColorStop(0, 'rgba(10,45,60,0.10)');
  grad.addColorStop(1, 'rgba(6,30,42,0.35)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, WATER_LINE, W, H - WATER_LINE);

  // simple animated wave lines
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 2;
  const t = performance.now()/600;
  for(let row=0; row<3; row++){
    const y = WATER_LINE + 20 + row*34;
    ctx.beginPath();
    for(let x=0; x<=W; x+=16){
      const yy = y + Math.sin(x*0.04 + t + row) * 3;
      if(x===0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
}

function drawBoat(){
  const bob = Math.sin(performance.now()/500) * 4;
  const sx = boat.frame * catFrameW;
  ctx.save();
  ctx.translate(boat.x, boat.y + bob);
  const drawW = boat.w, drawH = boat.h;
  ctx.drawImage(imgCat, sx, 0, catFrameW, catFrameH, -drawW/2, -drawH + 30, drawW, drawH);
  ctx.restore();

  // fishing line to hook (anzuelo puede estar lanzado lejos de la barca)
  ctx.strokeStyle = 'rgba(20,20,20,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(boat.x + 26, boat.y - 92 + bob);
  ctx.lineTo(hook.x, hook.y);
  ctx.stroke();
  ctx.fillStyle = '#c0392b';
  ctx.beginPath();
  ctx.arc(hook.x, hook.y, 5, 0, Math.PI*2);
  ctx.fill();
}

function drawRipples(){
  for(const r of ripples){
    ctx.save();
    ctx.globalAlpha = Math.max(0, r.life) * 0.6;
    ctx.strokeStyle = '#eaf7f0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.x, r.y, (1 - r.life) * 34, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawTrash(){
  for(const t of trashList){
    const s = t.size * t.scaleAnim;
    if(s <= 0) continue;
    const yy = t.y + Math.sin(t.bob) * 5;
    ctx.save();
    ctx.translate(t.x, yy);
    ctx.filter = t.hue ? `hue-rotate(${t.hue}deg)` : 'none';
    ctx.drawImage(imgTrash, -s/2, -s/2, s, s);
    ctx.restore();
  }
  ctx.filter = 'none';
}

function drawPopups(){
  ctx.font = "bold 16px 'Baloo 2', sans-serif";
  ctx.textAlign = 'center';
  for(const p of popups){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = '#ffe08a';
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawRipples();
  drawTrash();
  drawBoat();
  drawPopups();
}

function loop(ts){
  if(!lastTs) lastTs = ts;
  let dt = (ts - lastTs)/1000;
  lastTs = ts;
  dt = Math.min(dt, 0.05);
  if(state === 'playing') update(dt);
  render();
  requestAnimationFrame(loop);
}

Promise.all([loadImage(ASSETS.bg), loadImage(ASSETS.cat), loadImage(ASSETS.trash)]).then(([bg, cat, trash])=>{
  imgBg = bg; imgCat = cat; imgTrash = trash;
  catFrameW = cat.width / 3;
  catFrameH = cat.height;
  requestAnimationFrame(loop);
});
</script>
</body>
